name: DrawMate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Lint Verification (Server)
        run: npm --workspace=server run lint

      - name: TypeScript & Lint Verification (Client)
        run: npm --workspace=client run lint

      - name: Run Backend Integration & Unit Tests
        run: npm run test:server

      - name: Run Frontend Component Tests
        run: npm run test:client

      - name: Verify Database Index Generation
        run: npm --workspace=server run init-indexes

      - name: Setup Python 3.11 for ML Service
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python ML Sketch Recognizer Tests
        run: |
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/sketch_recognizer/requirements.txt pytest
          python -m pytest ml/sketch_recognizer/tests/

      - name: Build Backend Production Bundle
        run: npm run build:server

      - name: Build Frontend Production Bundle
        run: npm run build:client
