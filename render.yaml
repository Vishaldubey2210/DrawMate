services:
  # Backend API & WebSocket Service (Option A: Single Authoritative Instance)
  - type: web
    name: drawmate-api
    env: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm --workspace=server run build
    startCommand: npm --workspace=server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://drawmate-client.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: SKETCH_RECOGNIZER_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  # Frontend Single-Page App (SPA)
  - type: web
    name: drawmate-client
    env: static
    buildCommand: npm ci && npm --workspace=client run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://drawmate-api.onrender.com
      - key: VITE_SOCKET_URL
        value: https://drawmate-api.onrender.com

  # Optional ML Sketch Recognizer Microservice
  - type: web
    name: drawmate-sketch-recognizer
    env: docker
    dockerfilePath: ./ml/sketch_recognizer/Dockerfile
    dockerContext: ./ml/sketch_recognizer
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
